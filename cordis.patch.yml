# dsh-session-tag bundle patch: one host row over the Web or Desktop
# profile. The row name resolves from the profile's own node_modules where
# `dsh plugin --profile <profile> add <path>` installed this package.
#
# The host half is intentionally empty (see lib/index.js): it only puts a
# Loader entry in the tree so the browser half, discovered through this
# package's `dsh.client` declaration and served from `exports["./client"]`,
# reaches the page. All behavior lives in the client half.
- insert:
    - id: session-tag
      name: dsh-session-tag
